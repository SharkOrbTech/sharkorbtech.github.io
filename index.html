<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲨鱼星科技 | SharkOrb Tech</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="noise-overlay"></div>

<div class="main-wrap">

  <!-- NAVIGATION -->
  <nav class="nav" id="nav">
    <div class="nav-brand">
      <img src="images/logo.png" alt="SharkOrb">
      SharkOrb
    </div>
    <ul class="nav-links">
      <li><a href="#hero" data-zh="首页" data-en="Home">首页</a></li>
      <li><a href="#contact" data-zh="联系" data-en="Contact">联系</a></li>
    </ul>
    <button class="nav-lang" id="lang-toggle" aria-label="Switch language">EN</button>
  </nav>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-logo-wrap">
      <div class="hero-logo-ring2"></div>
      <div class="hero-logo-ring"></div>
      <img src="images/logo.png" alt="SharkOrb 鲨鱼星科技" class="hero-logo">
    </div>
    <h1 class="hero-h1" id="hero-title" data-zh="鲨鱼星科技" data-en="SharkOrb Tech">鲨鱼星科技</h1>
    <p class="hero-sub" data-zh="SharkOrb Tech">SharkOrb Tech</p>
    <a href="#contact" class="hero-scroll" aria-label="Scroll to contact">
      <span data-zh="了解更多" data-en="Learn More">了解更多</span>
      <div class="hero-scroll-line"></div>
    </a>
  </section>

  <!-- CONTACT -->
  <section class="section contact-section reveal" id="contact">
    <div class="section-inner">
      <span class="section-label" data-zh="Contact" data-en="Contact">Contact</span>
      <h2 class="section-h2" data-zh="取得联系" data-en="Get in Touch">取得联系</h2>
      <p class="section-body" style="margin-left:auto;margin-right:auto;" data-zh="我们位于中国武汉，随时欢迎您的垂询与合作。" data-en="Based in Wuhan, China. We welcome your inquiries and collaboration.">我们位于中国武汉，随时欢迎您的垂询与合作。</p>
      <div class="contact-card reveal-stagger">
        <div class="contact-row">
          <div class="contact-mark"></div>
          <span data-zh="中国 · 湖北省武汉市" data-en="Wuhan, Hubei, China">中国&nbsp;·&nbsp;湖北省武汉市</span>
        </div>
        <div class="contact-row">
          <div class="contact-mark"></div>
          <span data-zh="武汉鲨鱼星科技有限公司" data-en="Wuhan SharkOrb Tech Co., Ltd.">武汉鲨鱼星科技有限公司</span>
        </div>
        <div class="contact-row" data-zh="Wuhan SharkOrb Tech Co., Ltd.">
          <div class="contact-mark"></div>
          <span>Wuhan SharkOrb Tech Co., Ltd.</span>
        </div>
        <div class="contact-row">
          <div class="contact-mark"></div>
          <a href="mailto:hi@sharkorb.com">hi@sharkorb.com</a>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <span data-zh="© 2026 武汉鲨鱼星科技有限公司" data-en="© 2026 Wuhan SharkOrb Tech Co., Ltd.">© 2026 武汉鲨鱼星科技有限公司</span>
    </div>
  </footer>

</div>

<script src="js/main.js"></script>
</body>
</html>
